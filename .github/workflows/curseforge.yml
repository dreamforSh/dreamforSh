name: Update CurseForge stats

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: curseforge-stats

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Render CurseForge card
        run: python3 scripts/curseforge_card.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update CurseForge stats"
          git push
